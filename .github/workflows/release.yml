name: Build apps

# Push a tag like v1.3.0 (or publish a release with one) and this builds both apps and
# publishes them as that release. Notes come from release-notes/<tag>.md when it exists.
on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:  # a release made on the website fires twice (tag + release); build it once
  group: build-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    env:
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Require the release key for tagged builds
        if: startsWith(github.ref, 'refs/tags/') && env.HAS_KEY != 'true'
        run: |
          echo "::error::Add the ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASS and ANDROID_KEY_ALIAS secrets first. A tagged APK signed with a throwaway key could not update installed copies."
          exit 1
      - name: Install Android build tools (Ubuntu packages, no Gradle)
        run: |
          sudo apt-get update
          sudo apt-get install -y aapt zipalign apksigner dalvik-exchange android-sdk-platform-23
      - name: Check catalog
        run: node tools/check-catalog.mjs
      - name: Take the version from the release tag
        if: github.ref_type == 'tag'
        run: node tools/set-version.mjs "${{ github.ref_name }}"
      - name: Restore release key
        if: env.HAS_KEY == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Build APK
        env:
          KEYSTORE: ${{ env.HAS_KEY == 'true' && format('{0}/release.jks', runner.temp) || '' }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: bash android/build.sh
      - uses: actions/upload-artifact@v4
        with: { name: android, path: dist/*.apk }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Take the version from the release tag
        if: github.ref_type == 'tag'
        run: node tools/set-version.mjs "${{ github.ref_name }}"
      - name: Build installer and portable exe
        working-directory: desktop
        run: |
          npm ci
          npm run dist:win
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: dist/*.exe }

  release:
    if: github.ref_type == 'tag'
    needs: [android, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - name: Checksums and notes
        run: |
          cd out && sha256sum * > SHA256SUMS.txt && cd ..
          f="release-notes/${{ github.ref_name }}.md"
          [ -f "$f" ] || printf 'Impasto %s for Android and Windows.\n' "${{ github.ref_name }}" > "$f"
          echo "NOTES=$f" >> "$GITHUB_ENV"
      - uses: softprops/action-gh-release@v2
        with:
          name: Impasto ${{ github.ref_name }}
          body_path: ${{ env.NOTES }}
          files: out/*
