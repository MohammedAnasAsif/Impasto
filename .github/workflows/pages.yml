name: Website

# The store as a website (iPhone, iPad, Mac, any browser), published to the gh-pages branch.
# Previews ship with the site; full PNGs load from this repo's catalog on demand.
on:
  push:
    branches: [main]
    paths: ['app/**', 'catalog/catalog.json', 'tools/stage.mjs', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node tools/stage.mjs site none && touch site/.nojekyll
      - name: Push to gh-pages
        working-directory: site
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Website from ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
