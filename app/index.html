<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#090b11">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob: https:; connect-src 'self' https:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'">
  <title>Impasto</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <header class="bar" id="bar">
    <a class="brand" href="#/" aria-label="Impasto home">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M5 20c0-7 6-13 13-13 5 0 9 3 9 7 0 3-2 5-5 5-2 0-3 1-3 3s-2 4-5 4c-5 0-9-2-9-6Z"/><circle cx="12" cy="17" r="2.2"/><circle cx="18" cy="12.5" r="1.8"/></svg>
      <span>Impasto</span>
    </a>
    <nav class="links" aria-label="Main">
      <a href="#/" data-nav="shop">Shop</a>
      <a href="#/saved" data-nav="saved">Saved</a>
      <a href="#/library" data-nav="library">Library</a>
      <a href="#/about" data-nav="about">About</a>
    </nav>
    <form class="search" role="search" id="searchForm">
      <svg class="i" aria-hidden="true"><use href="#i-search"/></svg>
      <input id="q" type="search" name="q" placeholder="Search wallpapers" aria-label="Search wallpapers" autocomplete="off">
    </form>
    <div class="seg" role="radiogroup" aria-label="Device" id="deviceSeg">
      <button type="button" role="radio" data-device="phone" aria-label="Phone"><svg class="i" aria-hidden="true"><use href="#i-phone"/></svg><span>Phone</span></button>
      <button type="button" role="radio" data-device="desktop" aria-label="Desktop"><svg class="i" aria-hidden="true"><use href="#i-monitor"/></svg><span>Desktop</span></button>
    </div>
    <a class="icon-btn search-link" href="#/search" aria-label="Search"><svg class="i"><use href="#i-search"/></svg></a>
    <a class="icon-btn bag-btn" href="#/bag" aria-label="Bag"><svg class="i"><use href="#i-bag"/></svg><b class="count" id="bagCount" hidden>0</b></a>
  </header>

  <main id="main" tabindex="-1"></main>

  <nav class="tabs" aria-label="Main">
    <a href="#/" data-nav="shop"><svg class="i"><use href="#i-shop"/></svg><span>Shop</span></a>
    <a href="#/search" data-nav="search"><svg class="i"><use href="#i-search"/></svg><span>Search</span></a>
    <a href="#/saved" data-nav="saved"><svg class="i"><use href="#i-heart"/></svg><span>Saved</span></a>
    <a href="#/bag" data-nav="bag"><svg class="i"><use href="#i-bag"/></svg><span>Bag</span><b class="count" id="bagCountTab" hidden>0</b></a>
    <a href="#/library" data-nav="library"><svg class="i"><use href="#i-stack"/></svg><span>Library</span></a>
  </nav>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <dialog class="sheet" id="setSheet" aria-labelledby="setSheetTitle">
    <form method="dialog">
      <h2 id="setSheetTitle">Set as wallpaper</h2>
      <p class="muted" id="setSheetNote">Choose where it goes.</p>
      <div class="sheet-actions">
        <button class="btn" value="home">Home screen</button>
        <button class="btn" value="lock">Lock screen</button>
        <button class="btn primary" value="both">Both</button>
      </div>
      <button class="btn ghost" value="cancel">Cancel</button>
    </form>
  </dialog>

  <dialog class="zoom" id="zoom" aria-label="Full resolution view">
    <div class="zoom-bar">
      <span id="zoomTitle"></span>
      <form method="dialog"><button class="icon-btn" aria-label="Close"><svg class="i"><use href="#i-close"/></svg></button></form>
    </div>
    <div class="zoom-stage" id="zoomStage"><img id="zoomImg" alt=""></div>
  </dialog>

  <svg class="sprite" aria-hidden="true">
    <defs>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></symbol>
      <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20s-7.5-4.4-7.5-10A4.3 4.3 0 0 1 12 7.4 4.3 4.3 0 0 1 19.5 10c0 5.6-7.5 10-7.5 10Z"/></symbol>
      <symbol id="i-bag" viewBox="0 0 24 24"><path d="M5 8h14l-1 12H6L5 8Z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/></symbol>
      <symbol id="i-shop" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></symbol>
      <symbol id="i-stack" viewBox="0 0 24 24"><path d="M12 4 3.5 8.5 12 13l8.5-4.5L12 4Z"/><path d="m3.5 12.5 8.5 4.5 8.5-4.5"/><path d="m3.5 16.5 8.5 4.5 8.5-4.5"/></symbol>
      <symbol id="i-phone" viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/></symbol>
      <symbol id="i-monitor" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M9 20h6M12 16v4"/></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11m0 0-4.5-4.5M12 15l4.5-4.5"/><path d="M5 19h14"/></symbol>
      <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 15V4m0 0L8 8m4-4 4 4"/><path d="M6 11v8h12v-8"/></symbol>
      <symbol id="i-brush" viewBox="0 0 24 24"><path d="M14.5 4.5 19.5 9.5 11 18l-5-5 8.5-8.5Z"/><path d="M6 13c-2 0-3 1.5-3 3.5V20h3.5c2 0 3.5-1 3.5-3"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
      <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5 8 12l7 7"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
      <symbol id="i-zoom" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5M11 8v6M8 11h6"/></symbol>
      <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3.5 7.5a2 2 0 0 1 2-2h4l2 2h7a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2v-10Z"/></symbol>
      <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M5 7h14M10 7V5h4v2M7 7l1 13h8l1-13"/></symbol>
    </defs>
  </svg>

  <script src="config.js"></script>
  <script src="native.js"></script>
  <script src="app.js"></script>
</body>
</html>
